name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Release signing is optional: without keystore.properties or KGS_RELEASE_* variables the
      # build configures normally and only the debug variant is built here.
      - name: Build Android and verify shared and Android code
        run: bash tools/verify-port.sh --console=plain

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            core/data/build/reports/tests/
            core/data/build/test-results/
            core/shared/build/reports/tests/
            core/shared/build/test-results/
            shared/ui/build/reports/tests/
            shared/ui/build/test-results/
          if-no-files-found: ignore
