name: Windows Store package

# Builds the Microsoft Store package, tries it on a clean Windows, runs Microsoft's certification kit
# on it and keeps the package to upload to Partner Center. See docs/microsoft-store/README.md.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktopApp/**'
      - '.github/workflows/windows-store.yml'

permissions:
  contents: read

concurrency:
  group: windows-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and certify the Store package
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build a package to test
        shell: pwsh
        run: >
          ./gradlew.bat --no-daemon --console=plain
          "-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8"
          "-Pkotlin.compiler.execution.strategy=in-process"
          -PmsixTest :desktopApp:packageMsix

      - name: Sign the test package with a test certificate
        shell: pwsh
        run: |
          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
            Where-Object { Test-Path "$($_.FullName)\x64\signtool.exe" } | Sort-Object Name | Select-Object -Last 1
          $package = (Get-ChildItem desktopApp/build/msix -Filter *.msix | Select-Object -First 1).FullName
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=KGS501 Test' -KeyUsage DigitalSignature `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          & "$($sdk.FullName)\x64\signtool.exe" sign /fd SHA256 /sha1 $cert.Thumbprint /s My $package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Export-Certificate -Cert $cert -FilePath test.cer | Out-Null
          Import-Certificate -FilePath test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          "TEST_PACKAGE=$package" | Add-Content $env:GITHUB_ENV

      - name: Install and start it
        shell: pwsh
        run: |
          Add-AppxPackage -Path $env:TEST_PACKAGE -ErrorAction Stop
          $package = Get-AppxPackage -Name 'KGS501.KGSCalendar.Test'
          "Installed $($package.PackageFullName)"
          Start-Process explorer.exe "shell:AppsFolder\$($package.PackageFamilyName)!KGSCalendar"
          Start-Sleep -Seconds 45
          $running = Get-Process 'KGS Calendar' -ErrorAction SilentlyContinue
          if (-not $running) { throw 'The app did not stay running' }
          "Running from $($running[0].Path)"
          $running | Stop-Process -Force
          Remove-AppxPackage -Package $package.PackageFullName

      - name: Run the Windows App Certification Kit
        shell: pwsh
        run: |
          $kit = 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\appcert.exe'
          if (-not (Test-Path $kit)) { throw 'The App Certification Kit is not on this runner' }
          $report = "$PWD\certification-report.xml"
          & $kit reset
          & $kit test -appxpackagepath $env:TEST_PACKAGE -reportoutputpath $report
          [xml]$xml = Get-Content $report
          "Overall result: $($xml.REPORT.OVERALL_RESULT)"
          $failed = $xml.SelectNodes("//TEST[RESULT='FAIL']")
          foreach ($test in $failed) { "FAILED: $($test.NAME)"; $test.MESSAGES.MESSAGE | ForEach-Object { "  $($_.TEXT)" } }
          if ($xml.REPORT.OVERALL_RESULT -ne 'PASS') { exit 1 }

      - name: Upload the certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-report
          path: certification-report.xml
          if-no-files-found: ignore

      # With the identity in desktopApp/msix/store-identity.properties, for Partner Center. The Store signs it.
      - name: Build the package for the Store
        shell: pwsh
        run: >
          ./gradlew.bat --no-daemon --console=plain
          "-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8"
          "-Pkotlin.compiler.execution.strategy=in-process"
          :desktopApp:packageMsix

      - name: Upload the Store package
        uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: desktopApp/build/msix/*.msix
          if-no-files-found: error
