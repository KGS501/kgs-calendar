name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Builds to run (manual override)
        type: choice
        default: all
        options: [all, android, shared, ios]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.select.outputs.android }}
      shared: ${{ steps.select.outputs.shared }}
      ios: ${{ steps.select.outputs.ios }}
    steps:
      - uses: actions/checkout@v4

      - name: Test CI selection and verification commands
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v

      - name: Select affected builds
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_TARGET: ${{ inputs.target }}
        run: python3 tools/ci/select_builds.py

  build:
    name: Android and shared checks
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # One Gradle invocation shares compilation work when both groups are selected.
      - name: Run selected checks
        env:
          CHECK_ANDROID: ${{ needs.changes.outputs.android }}
          CHECK_SHARED: ${{ needs.changes.outputs.shared }}
        run: |
          if [[ "$CHECK_ANDROID" == true && "$CHECK_SHARED" == true ]]; then
            bash tools/verify-port.sh --console=plain
          elif [[ "$CHECK_ANDROID" == true ]]; then
            bash tools/verify-port.sh --android-only --console=plain
          else
            bash tools/verify-port.sh --shared-only --console=plain
          fi

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            core/data/build/reports/tests/
            core/data/build/test-results/
            core/shared/build/reports/tests/
            core/shared/build/test-results/
            shared/ui/build/reports/tests/
            shared/ui/build/test-results/
          if-no-files-found: ignore

  build-ios:
    name: iOS validation host
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # Standard Apple Silicon runner; the project targets iosSimulatorArm64.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Pin the Xcode generation supported by the current Kotlin/Native toolchain.
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-xcode26.0.1-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}

      # Root Gradle configuration still includes Android modules.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 defaults to the retired "tools" package; install only what we need below.
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build unsigned iOS Simulator host
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/KgsCalendar.xcodeproj \
            -scheme KgsCalendar \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/kgs-ios" \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            build 2>&1 | tee "$RUNNER_TEMP/kgs-ios-build.log"

      - name: Upload Apple build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/kgs-ios-build.log
          if-no-files-found: ignore

  ci:
    name: CI result
    if: always()
    needs: [changes, build, build-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Require this check in branch protection: intentional skips pass, failures do not.
      - name: Check selected results
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          LINUX_REQUIRED: ${{ needs.changes.outputs.android == 'true' || needs.changes.outputs.shared == 'true' }}
          IOS_REQUIRED: ${{ needs.changes.outputs.ios }}
          LINUX_RESULT: ${{ needs.build.result }}
          IOS_RESULT: ${{ needs.build-ios.result }}
        run: |
          [[ "$SELECTION_RESULT" == success ]] || exit 1
          expected_linux=skipped
          expected_ios=skipped
          if [[ "$LINUX_REQUIRED" == true ]]; then expected_linux=success; fi
          if [[ "$IOS_REQUIRED" == true ]]; then expected_ios=success; fi
          [[ "$LINUX_RESULT" == "$expected_linux" && "$IOS_RESULT" == "$expected_ios" ]]
