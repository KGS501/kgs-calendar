name: TestFlight
run-name: TestFlight build ${{ github.run_number }}.${{ github.run_attempt }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-delivery
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: testflight
    timeout-minutes: 60
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check delivery configuration
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          TESTFLIGHT_GROUP_ID: ${{ vars.TESTFLIGHT_GROUP_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: |
          for name in APPLE_TEAM_ID ASC_APP_ID TESTFLIGHT_GROUP_ID ASC_KEY_ID ASC_ISSUER_ID \
              ASC_PRIVATE_KEY APPLE_DISTRIBUTION_P12_BASE64 APPLE_P12_PASSWORD APPLE_PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure $name in the testflight environment before uploading."
              exit 1
            fi
          done

      - name: Set build number
        id: version
        env:
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ios/requirements.txt
      - run: python3 -m pip install -r tools/ios/requirements.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-xcode26.0.1-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Archive, sign, and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
          KGS_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: bash tools/ios/upload-testflight.sh

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-build-logs
          path: |
            ${{ runner.temp }}/kgs-testflight/archive.log
            ${{ runner.temp }}/kgs-testflight/upload.log
          if-no-files-found: ignore
          retention-days: 7

  available:
    name: Confirm TestFlight availability
    needs: upload
    runs-on: ubuntu-latest
    environment: testflight
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ios/requirements.txt
      - run: python3 -m pip install -r tools/ios/requirements.txt

      # Apple processing waits use Linux, not a macOS build runner.
      - name: Wait for processing and confirm internal testing
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          TESTFLIGHT_GROUP_ID: ${{ vars.TESTFLIGHT_GROUP_ID }}
          BUILD_NUMBER: ${{ needs.upload.outputs.build_number }}
        run: |
          key_file=$(mktemp "$RUNNER_TEMP/kgs-asc.XXXXXX")
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_file"
          unset ASC_PRIVATE_KEY
          export ASC_KEY_PATH="$key_file"
          for attempt in {1..30}; do
            status=0
            python3 tools/ios/app_store.py check-build --app-id "$ASC_APP_ID" \
              --group-id "$TESTFLIGHT_GROUP_ID" --version "$BUILD_NUMBER" || status=$?
            if [[ "$status" == 0 ]]; then
              echo "Build $BUILD_NUMBER is available in the KGS iOS Development TestFlight group." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$status" != 2 ]]; then exit "$status"; fi
            sleep 30
          done
          echo '::error::Apple has not finished processing. Rerun only this job to check again; the uploaded build is retained.'
          exit 1
